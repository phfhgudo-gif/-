name: Make jar
on:
  push:
  workflow_dispatch:
jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unpack project
        run: |
          mkdir proj
          unzip -q thanpisitkub-mod.zip -d proj
          B="$(find proj -name build.gradle | head -1)"
          echo "ROOT=$(dirname "$B")" >> "$GITHUB_ENV"
      - name: Build
        working-directory: ${{ env.ROOT }}
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: thanpisitkub-jar
          path: ${{ env.ROOT }}/build/libs/*.jar
